# The bundle patch for dsh-agent-playbook.
#
# Added to a profile's bundle list, this row mounts the plugin. `config` is patched
# whole (not merged), so a deployment that wants different behaviour restates the
# complete config in its own profile patch.
#
# The plugin needs no engine install to LOAD: it discovers a playbook by walking up
# from the session workspace for playbook.yaml / playbook.json, and stays dormant if
# there is none. That keeps it harmless in workspaces that do not use a playbook.
- insert:
    - id: agent-playbook
      name: 'dsh-agent-playbook'
      config:
        # Empty → discover from the session workspace. Set an absolute path to pin
        # one playbook regardless of where the session was opened.
        playbookPath: ''
        # Stage the constitution (North Star, active loop, task in hand, its
        # acceptance checks) on the agent's inbox before each step, so compaction and
        # long sessions cannot lose the plot.
        injectContext: true
        # Stay silent when the backlog has nothing todo or in progress.
        quietWhenIdle: true
        maxContextChars: 4000
        commandTimeoutMs: 120000
        # The Stop gate: when a turn is about to end while this agent still holds a claim it
        # never resolved, hold the turn open once and say so. This is the one place the
        # harness enforces the playbook's promise instead of trusting the agent to verify.
        # It nudges at most ONCE per claim (a hook that blocks every time would force-continue
        # every step forever), so it costs at most one extra step per claimed task.
        # Set false to make the loop advisory again.
        stopGate: true

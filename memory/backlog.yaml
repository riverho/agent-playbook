# memory/backlog.yaml — the task queue the loop pulls from.
# Managed by `pb` (next --claim / record). Edit by hand to add tasks.
# status: todo | in_progress | blocked | done   priority: 1 = highest
# acceptance_checks: shell commands that must exit 0 before `record --status done` succeeds.
tasks:
  - id: plan-20260721-001
    title: 'O1: Add portable RunCard schema and JSON rendering helpers for PB worker runs'
    status: todo
    skill: run-task
    mode: coding
    priority: 1
    acceptance_checks:
      - node scripts/test-orca-runcard.mjs
      - node scripts/pb.mjs validate
  - id: plan-20260721-002
    title: 'O2: Add agent-facing JSON surfaces for status and task inspection'
    status: todo
    skill: run-task
    mode: coding
    priority: 2
    acceptance_checks:
      - node scripts/test-orca-json-surfaces.mjs
      - node scripts/pb.mjs status --json >/tmp/pb-status.json
      - node scripts/pb.mjs validate
  - id: plan-20260721-003
    title: 'O3: Add dry-run worker worktree lifecycle plus checker verdict commands'
    status: todo
    skill: run-task
    mode: coding
    priority: 3
    acceptance_checks:
      - node scripts/test-orca-worker-lifecycle.mjs
      - node scripts/pb.mjs validate
  - id: plan-20260721-004
    title: 'O4: Document Wenmei integration contract: PB owns truth, Wenmei is UI/control surface'
    status: todo
    skill: run-task
    mode: coding
    priority: 4
    acceptance_checks:
      # `test -f` alone passed while docs/ was gitignored — the doc existed on disk
      # but shipped in no commit. Assert it is tracked, not merely present.
      - git ls-files --error-unmatch docs/wenmei-pb-integration-contract.md
      - grep -q 'PB owns truth' docs/wenmei-pb-integration-contract.md
      - grep -q 'checker' docs/wenmei-pb-integration-contract.md
      - node scripts/pb.mjs validate
  - id: plan-20260721-005
    title: 'O5: Wire Orca-spine regression tests into npm test'
    status: todo
    skill: run-task
    mode: coding
    priority: 5
    acceptance_checks:
      - grep -q 'test-orca-runcard.mjs' package.json
      - grep -q 'test-orca-json-surfaces.mjs' package.json
      - grep -q 'test-orca-worker-lifecycle.mjs' package.json
      - npm test
  - id: multi-loop-safety-carryover
    title: >-
      Restore the multi-worker safety debt abandoned with loop-20260719-001: serialized/crash-recoverable
      state mutation, claim tokens and `pb release`, track affinity, operator waiting, honest close,
      and the concurrency regression suite
    status: todo
    skill: run-task
    mode: coding
    priority: 6
    notes: >-
      The fresh-start reset archived 30 tasks; 9 of them were unfinished multi-worker safety work.
      This placeholder keeps that debt visible — expand it back into the individual tasks from the
      archive when the work is picked up. Newly relevant: `pb worker checker` and
      `pb worker provider-rate-limit` do unlocked read-modify-write on backlog-state.json, the same
      lost-update hazard multi-loop-transactional-state was chartered to close.
    acceptance_checks:
      - test -f artifacts/loops/loop-20260721-001/backlog-snapshot-pre-fresh.yaml
      - grep -q 'multi-loop-transactional-state' artifacts/loops/loop-20260721-001/backlog-snapshot-pre-fresh.yaml
